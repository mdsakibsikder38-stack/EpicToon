<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EpicToon – Manhwa Reader</title>
<style>
:root{--bg:#f3f1f7;--surface:#fff;--ink:#1c1b29;--mute:#6b6a7d;--accent:#5b3df5;--line:#dedbe9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14131c;--surface:#1e1d29;--ink:#eeedf7;--mute:#9a99ad;--accent:#8f78ff;--line:#2e2c3d}}
:root[data-theme="dark"]{--bg:#14131c;--surface:#1e1d29;--ink:#eeedf7;--mute:#9a99ad;--accent:#8f78ff;--line:#2e2c3d}
html{color-scheme:light dark;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Trebuchet MS",system-ui,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
header h1{font-size:1.15rem;margin:0;flex:1;font-family:Georgia,serif}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 14px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.4;cursor:default}
main{max-width:760px;margin:0 auto;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.card{padding:0;text-align:left;overflow:hidden;border-radius:10px}
.cover{aspect-ratio:3/4;display:flex;align-items:flex-end;padding:10px;color:#fff;font-family:Georgia,serif;font-size:1.1rem;font-weight:700}
.card .meta{padding:10px;font-size:.85rem;color:var(--mute)}
.card b{display:block;color:var(--ink);font-size:.95rem}
.detail{display:flex;gap:16px;margin-bottom:16px}
.detail .cover{width:130px;flex:none;border-radius:10px}
.ch{display:flex;justify-content:space-between;align-items:center;width:100%;margin-bottom:8px;text-align:left}
.ch.read{color:var(--mute)}
.reader{background:#000;min-height:100vh}
.page{display:block;width:100%;max-width:760px;margin:0 auto}
.bar{position:sticky;bottom:0;display:flex;justify-content:space-between;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line)}
.note{font-size:.85rem;color:var(--mute);margin-top:24px}
.empty{padding:40px 0;text-align:center;color:var(--mute)}
</style>
</head>
<body>
<header>
  <button id="back" hidden aria-label="Back">Back</button>
  <h1 id="title">EpicToon</h1>
  <button id="theme" aria-label="Toggle dark mode">Theme</button>
</header>
<main id="app"></main>

<script>
/* ---------- CONTENT SOURCE ----------
   To use your own library, host a content.json file (GitHub Pages is free)
   and put its address here. Leave empty to use the demo data below.
   Page images must be files you own or have permission to publish. */
var CONTENT_URL = "";

var DEMO = {series:[
 {id:"neon-tide",title:"Neon Tide",author:"Demo Author",color:["#5b3df5","#e0457b"],about:"A courier races across a flooded city after dark. Demo story with generated pages.",
  chapters:[{id:"c1",title:"Chapter 1",pages:6},{id:"c2",title:"Chapter 2",pages:5},{id:"c3",title:"Chapter 3",pages:7}]},
 {id:"paper-moon",title:"Paper Moon",author:"Demo Author",color:["#0e8a7d","#f2b632"],about:"A lantern maker finds a door in the sky. Demo story with generated pages.",
  chapters:[{id:"c1",title:"Chapter 1",pages:5},{id:"c2",title:"Chapter 2",pages:6}]}
]};

var store={get:function(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
 set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

var data=DEMO, state={view:"library",sid:null,cid:null}, read=store.get("read",{});
var app=document.getElementById("app"), titleEl=document.getElementById("title"), backBtn=document.getElementById("back");

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function grad(s){return "background:linear-gradient(160deg,"+s.color[0]+","+s.color[1]+")"}
function series(id){return data.series.filter(function(s){return s.id===id})[0]}

/* Page source: real image URLs if provided, else generated demo panels */
function pageSrc(s,ch,i){
  if(ch.images&&ch.images[i]) return ch.images[i];
  var h=(i*47+s.title.length*31)%360;
  var svg='<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1200"><rect width="800" height="1200" fill="hsl('+h+',55%,88%)"/><circle cx="'+(200+(i*130)%400)+'" cy="420" r="150" fill="hsl('+((h+40)%360)+',60%,62%)"/><rect x="120" y="720" width="560" height="260" rx="20" fill="hsl('+((h+200)%360)+',45%,35%)"/><text x="400" y="1110" text-anchor="middle" font-family="Georgia" font-size="42" fill="#222">'+s.title+' · '+ch.title+' · p'+(i+1)+'</text></svg>';
  return "data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);
}
function pageCount(ch){return ch.images?ch.images.length:ch.pages}

function render(){
  backBtn.hidden=state.view==="library";
  if(state.view==="library"){
    titleEl.textContent="EpicToon";
    var html='<div class="grid">'+data.series.map(function(s){
      var done=s.chapters.filter(function(c){return read[s.id+"/"+c.id]}).length;
      return '<button class="card" data-s="'+s.id+'"><div class="cover" style="'+grad(s)+'">'+esc(s.title)+'</div><div class="meta"><b>'+esc(s.author)+'</b>'+done+' / '+s.chapters.length+' read</div></button>';
    }).join("")+'</div>';
    html+='<p class="note">'+(CONTENT_URL?'Library loaded from your content.json.':'Showing demo stories. Set CONTENT_URL in the code to load your own library.')+'</p>';
    app.innerHTML=data.series.length?html:'<div class="empty">No series yet. Add one to your content.json.</div>';
    app.querySelectorAll(".card").forEach(function(b){b.onclick=function(){state={view:"series",sid:b.dataset.s};render();window.scrollTo(0,0)}});
  }else if(state.view==="series"){
    var s=series(state.sid); titleEl.textContent=s.title;
    var last=store.get("last:"+s.id,null);
    var h='<div class="detail"><div class="cover" style="'+grad(s)+'">'+esc(s.title)+'</div><div><p>'+esc(s.about)+'</p>'+(last?'<button class="primary" data-c="'+last+'">Continue reading</button>':'<button class="primary" data-c="'+s.chapters[0].id+'">Start reading</button>')+'</div></div>';
    h+=s.chapters.map(function(c){var r=read[s.id+"/"+c.id];return '<button class="ch'+(r?' read':'')+'" data-c="'+c.id+'"><span>'+esc(c.title)+'</span><span>'+(r?'Read':pageCount(c)+' pages')+'</span></button>'}).join("");
    app.innerHTML=h;
    app.querySelectorAll("[data-c]").forEach(function(b){b.onclick=function(){state={view:"reader",sid:s.id,cid:b.dataset.c};render();window.scrollTo(0,0)}});
  }else{
    var s2=series(state.sid), idx=s2.chapters.findIndex(function(c){return c.id===state.cid}), ch=s2.chapters[idx];
    titleEl.textContent=s2.title+" · "+ch.title;
    store.set("last:"+s2.id,ch.id);
    var imgs="";for(var i=0;i<pageCount(ch);i++){imgs+='<img class="page" loading="lazy" alt="'+esc(ch.title)+' page '+(i+1)+'" src="'+pageSrc(s2,ch,i)+'">'}
    app.style.padding="0";app.style.maxWidth="none";
    app.innerHTML='<div class="reader">'+imgs+'</div><div class="bar"><button id="prev"'+(idx===0?' disabled':'')+'>Previous</button><button id="next" class="primary">'+(idx===s2.chapters.length-1?'Finish':'Next chapter')+'</button></div>';
    document.getElementById("prev").onclick=function(){state.cid=s2.chapters[idx-1].id;render();window.scrollTo(0,0)};
    document.getElementById("next").onclick=function(){
      read[s2.id+"/"+ch.id]=1;store.set("read",read);
      if(idx<s2.chapters.length-1){state.cid=s2.chapters[idx+1].id}else{state={view:"series",sid:s2.id}}
      render();window.scrollTo(0,0)};
    return;
  }
  app.style.padding="";app.style.maxWidth="";
}
backBtn.onclick=function(){state=state.view==="reader"?{view:"series",sid:state.sid}:{view:"library"};render();window.scrollTo(0,0)};
document.getElementById("theme").onclick=function(){
  var r=document.documentElement,dark=r.getAttribute("data-theme")==="dark"||(!r.getAttribute("data-theme")&&matchMedia("(prefers-color-scheme:dark)").matches);
  r.setAttribute("data-theme",dark?"light":"dark");store.set("theme",dark?"light":"dark")};
var t=store.get("theme",null);if(t)document.documentElement.setAttribute("data-theme",t);

if(CONTENT_URL){fetch(CONTENT_URL).then(function(r){return r.json()}).then(function(j){data=j;render()}).catch(function(){render()})}
render();
</script>
</body>
</html>
